name: Publish Docker images

# Builda e publica as imagens de produção (stage `runtime` de api/Dockerfile
# e web/Dockerfile) no Docker Hub, no repositório `justbrunasso/ifsclima` —
# mesmo esquema de tags já usado por `.scripts/docker-publish.ps1`
# (`api-<versão>`/`api-latest`, `web-<versão>`/`web-latest`), só que rodando
# num runner do GitHub em vez da máquina local. `docker-compose.swarm.yml`
# consome exatamente essas tags no deploy remoto.
#
# Requer dois secrets do repositório (Settings > Secrets and variables >
# Actions): DOCKERHUB_USERNAME e DOCKERHUB_TOKEN (um Access Token do Docker
# Hub, não a senha da conta).

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "db/migrations/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `git rev-list --count HEAD` precisa do histórico completo.

      - name: Calcula a versão (nº de commits — mesma lógica do .scripts/docker-publish.ps1)
        id: version
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push da api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          target: runtime
          push: true
          tags: |
            justbrunasso/ifsclima:api-${{ steps.version.outputs.value }}
            justbrunasso/ifsclima:api-latest

      - name: Build + push do web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          target: runtime
          push: true
          tags: |
            justbrunasso/ifsclima:web-${{ steps.version.outputs.value }}
            justbrunasso/ifsclima:web-latest
