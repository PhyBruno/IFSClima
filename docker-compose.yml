services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: ${API_TARGET:-dev}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INGEST_API_KEY: ${INGEST_API_KEY}
      MAX_BATCH: ${MAX_BATCH:-5000}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    volumes:
      - ./api:/app
      - /app/node_modules
      # F2 (T2.4): migrations Drizzle (db/migrations na raiz) — montado em
      # /db para src/db/migrate.ts encontrar sem rebuild da imagem quando
      # `npm run db:generate` cria uma migration nova.
      - ./db/migrations:/db/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${API_PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: ${WEB_TARGET:-dev}
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # F6 T6.5: proxy do Vite dev server (vite.config.ts) pro serviço `api`
      # pelo hostname da rede Docker — sem isso, o api-client (T6.1) chamando
      # `/api/v1/...` relativo não teria pra onde ir dentro do container `web`.
      API_PROXY_TARGET: http://api:${API_PORT:-3000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
