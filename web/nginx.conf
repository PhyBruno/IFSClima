server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # F7 (revisão de código, achado 1): o default do Nginx pra
    # `client_max_body_size` é 1MB, menor que o `bodyLimit` de 10MB do
    # backend (`api/src/routes/ingest.ts`, `INGEST_BODY_LIMIT_BYTES`) e
    # menor do que um lote de recuperação de buffer com `MAX_BATCH=5000`
    # leituras pode pesar (~0.6-1MB+ de JSON). Sem isto, uma estação
    # reenviando um lote grande batendo no domínio público (via Nginx, não
    # direto na porta da api) recebe um 413 do Nginx com corpo HTML — que o
    # firmware não reconhece, pois espera o 413 JSON estruturado da própria
    # API. Usamos 15MB (10MB do backend + margem) como teto no Nginx; quem
    # decide o limite "de verdade" continua sendo o backend.
    client_max_body_size 15m;

    # F7 (T7.3): em dev, o Vite dev server encaminha `/api/*` pro serviço
    # `api` da rede Docker (vite.config.ts, server.proxy["/api"]). Em
    # produção é o Nginx quem serve os assets estáticos — sem este proxy,
    # `web/src/api-client.ts` (fetch relativo, same-origin) não teria pra
    # onde ir. Upstream hardcoded (não via env/envsubst): a porta interna
    # da rede Docker (3000) já é uma convenção fixa em todo o projeto
    # (docker-compose.yml, .env.example, docs/) — não é um segredo nem
    # varia por ambiente, então parametrizar via template+envsubst só
    # adicionaria uma camada de risco (envsubst também substitui variáveis
    # nativas do Nginx tipo $uri/$host se não filtradas) sem benefício real.
    # `proxy_pass` sem path após o host preserva a URI original (`/api/v1/...`),
    # que já bate com o prefixo registrado em `api/src/app.ts`.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # F7 (revisão de código, achado 1): `GET /api/v1/readings/export` (F8,
    # HIST-09) é desenhado pro backend fazer streaming da resposta (CSV/XLSX)
    # sem estourar memória em exports grandes. Os defaults do Nginx
    # (`proxy_buffering on`, `proxy_read_timeout 60s`) quebram isso: o Nginx
    # bufferiza a resposta inteira antes de repassar ao cliente e, pra
    # exports grandes/lentos, o timeout de 60s derruba a conexão com 504
    # antes do streaming terminar. Location mais específica que `/api/`
    # (Nginx dá prioridade ao prefixo mais longo), então só afeta este
    # endpoint — o restante de `/api/` continua coberto pela location acima.
    location /api/v1/readings/export {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # F7 (revisão de código, achado 2): a location `/healthz` era código
    # morto — nada em docker-compose.yml/docker-compose.prod.yml referencia
    # esse path (o serviço `web` não tem healthcheck configurado) — e ainda
    # usava `add_header` junto de `return`, que é o anti-pattern conhecido
    # do Nginx (o correto pra content-type de uma resposta de `return` é
    # `default_type`, não `add_header`, que só vale pra respostas normais de
    # arquivo/proxy). Decisão: REMOVIDA em vez de corrigida — sem nenhum
    # healthcheck de load balancer configurado hoje, manter só a diretiva
    # certa não justificaria manter código sem uso; se um healthcheck
    # externo for adicionado no futuro, recriar a location com
    # `default_type text/plain;`.
}
